spring.application.name=due-diligence-agent-test

# ==========================
# In-memory H2 database (test only)
# ==========================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.port=0

jwt.secret=test-secret-key-for-integration-tests-only-not-for-production-use-0123456789
jwt.expiration=3600000

# Disable real mail sending during tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test

google.client.id=test-client-id.apps.googleusercontent.com

app.upload.profile-images-dir=target/test-uploads/profile-images

logging.level.org.hibernate.SQL=WARN
logging.level.com.realestate.due_diligence_agent=INFO
